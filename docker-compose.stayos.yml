# StayOS — the hotel-OS deployment of this same repository.
#
# Coolify build pack: Docker Compose. Compose file: /docker-compose.stayos.yml
#
# The marketplace stack is `docker-compose.yml`. This is its sibling: same
# image, different Supabase project, its own Redis, its own hostname. Neither
# file knows about the other and they share nothing at runtime.
#
#   marketplace   backend.travbuddy.in          uabxtdhxbamuhthxnhid
#   StayOS        api.hostos.in   rdlozqvuywtgsodunait
#
# ── Redis belongs to this stack ──────────────────────────────────────────────
#
# The marketplace's Redis is a service inside *its* compose stack: no password,
# and not reachable from another Coolify application. Pointing StayOS at a
# `redis` hostname from outside reached something else entirely and answered
# `Authentication required.` The `redis` service below is this stack's own —
# Docker's network puts it on the hostname `redis` for the containers in this
# file and nowhere else, so there is no password to manage and no way for the
# two products to collide in Redis at all.
#
# `app/workers/celery_app.py` still routes hotel-OS tasks to a `hotelos` queue.
# With separate Redis servers that is belt and braces rather than the only
# thing keeping the products apart, and it stays because it costs nothing and
# the failure it prevents is silent.
#
# ── the worker is not optional ───────────────────────────────────────────────
#
# The image's CMD is uvicorn, so a Dockerfile-build-pack deployment runs the
# API alone. StayOS had no Celery worker at all: messaging and marketing tasks
# would queue forever with nothing in any log saying so.
#
# ── environment ──────────────────────────────────────────────────────────────
#
# Everything except REDIS_URL comes from Coolify's environment — paste
# `.env.stayos.coolify` there. REDIS_URL is set per-service below because it
# describes this stack's topology rather than a secret, and a compose
# `environment:` value wins over Coolify's tab. Do not also set it in Coolify.
#
# No `version:` key: Compose v2 ignores it and warns that it is obsolete.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - stayos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    expose:
      - "8000"
    labels:
      # Router and service names are `stayos`, not `api` — the marketplace
      # stack already registers `traefik.http.routers.api` on this same Traefik,
      # and two routers of one name is one router.
      - "traefik.enable=true"
      # Both names during the cutover. `api.hostos.in` is where the backend
      # lives now; `stayos-backend.travbuddy.in` is still claimed because two
      # things outside this repo still point at it — the PWA bundle currently
      # deployed (VITE_API_BASE_URL is baked in at build time, so it changes
      # only on a rebuild) and the Instagram webhook URL registered in the Meta
      # console, which is Meta's configuration and not ours. Drop the second
      # Host() once the PWA has been rebuilt and the webhook repointed;
      # removing it earlier stops message delivery with no error on our side.
      - "traefik.http.routers.stayos.rule=Host(`api.hostos.in`) || Host(`stayos-backend.travbuddy.in`)"
      - "traefik.http.routers.stayos.entrypoints=https"
      - "traefik.http.routers.stayos.tls=true"
      - "traefik.http.routers.stayos.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stayos.service=stayos"
      - "traefik.http.services.stayos.loadbalancer.server.port=8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/stayos
      - PLACES_CACHE_DIR=/tmp/stayos/places_cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    # `-Q hotelos` and nothing else. Messaging and marketing tasks route there;
    # every marketplace task stays on the default `celery` queue, which this
    # worker never subscribes to. Proven in tests/test_celery_routing.py and
    # against a real broker.
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q hotelos --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/stayos
      - PLACES_CACHE_DIR=/tmp/stayos/places_cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── beat, scoped to StayOS's own schedule ───────────────────────────────────
  #
  # There was deliberately no beat service here, and the reason given was that
  # "every entry in beat_schedule is a marketplace task, and
  # revert_intro_commission writes hourly to `partners` — a table that also
  # exists, meaning something entirely different, in the hotel OS."
  #
  # That was true when it was written. It stopped being true when the
  # waiting-guest sweep was added to the schedule, and nobody noticed, because
  # the entry carried a comment explaining that the *marketplace* beat would
  # enqueue it and the StayOS worker would pick it up off the `hotelos` queue.
  #
  # That reasoning assumed one broker. This file brings up its own Redis, and
  # the api and worker above both point at it. So the marketplace beat enqueues
  # the sweep onto the marketplace broker and the StayOS worker listens to the
  # StayOS broker, and the task has never once been delivered. There is no
  # error to find: the guest simply waits, and the notification built to reach
  # a manager's phone reaches nothing. Production had zero rows in
  # `agent_escalations`, ever.
  #
  # `CELERY_BEAT_ROLE=stayos` is what makes this safe rather than a rerun of
  # the original problem: it schedules the sweep and nothing else, so nothing
  # on this beat can write to a marketplace table. See
  # `app/workers/celery_app._beat_schedule`.
  #
  # One replica. Two beats on one schedule is two notifications per waiting
  # guest — the escalation dedupe key would collapse them, but relying on a
  # dedupe to cover a duplicated scheduler is how a dedupe becomes load-bearing
  # for something it was not written for.
  beat:
    build: .
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BEAT_ROLE=stayos
      - TEMP_DIR=/tmp/stayos
      - PLACES_CACHE_DIR=/tmp/stayos/places_cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

volumes:
  stayos_redis_data:
