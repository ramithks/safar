# StayOS — the hotel-OS deployment of this same repository.
#
# Coolify build pack: Docker Compose. Compose file: /docker-compose.stayos.yml
#
# The marketplace stack is `docker-compose.yml`. This is its sibling: same
# image, different Supabase project, its own Redis, its own hostname. Neither
# file knows about the other and they share nothing at runtime.
#
#   marketplace   backend.travbuddy.in          uabxtdhxbamuhthxnhid
#   StayOS        stayos-backend.travbuddy.in   rdlozqvuywtgsodunait
#
# ── Redis belongs to this stack ──────────────────────────────────────────────
#
# The marketplace's Redis is a service inside *its* compose stack: no password,
# and not reachable from another Coolify application. Pointing StayOS at a
# `redis` hostname from outside reached something else entirely and answered
# `Authentication required.` The `redis` service below is this stack's own —
# Docker's network puts it on the hostname `redis` for the containers in this
# file and nowhere else, so there is no password to manage and no way for the
# two products to collide in Redis at all.
#
# `app/workers/celery_app.py` still routes hotel-OS tasks to a `hotelos` queue.
# With separate Redis servers that is belt and braces rather than the only
# thing keeping the products apart, and it stays because it costs nothing and
# the failure it prevents is silent.
#
# ── the worker is not optional ───────────────────────────────────────────────
#
# The image's CMD is uvicorn, so a Dockerfile-build-pack deployment runs the
# API alone. StayOS had no Celery worker at all: messaging and marketing tasks
# would queue forever with nothing in any log saying so.
#
# ── environment ──────────────────────────────────────────────────────────────
#
# Everything except REDIS_URL comes from Coolify's environment — paste
# `.env.stayos.coolify` there. REDIS_URL is set per-service below because it
# describes this stack's topology rather than a secret, and a compose
# `environment:` value wins over Coolify's tab. Do not also set it in Coolify.
#
# No `version:` key: Compose v2 ignores it and warns that it is obsolete.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - stayos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    expose:
      - "8000"
    labels:
      # Router and service names are `stayos`, not `api` — the marketplace
      # stack already registers `traefik.http.routers.api` on this same Traefik,
      # and two routers of one name is one router.
      - "traefik.enable=true"
      - "traefik.http.routers.stayos.rule=Host(`stayos-backend.travbuddy.in`)"
      - "traefik.http.routers.stayos.entrypoints=https"
      - "traefik.http.routers.stayos.tls=true"
      - "traefik.http.routers.stayos.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stayos.service=stayos"
      - "traefik.http.services.stayos.loadbalancer.server.port=8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/stayos
      - PLACES_CACHE_DIR=/tmp/stayos/places_cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    # `-Q hotelos` and nothing else. Messaging and marketing tasks route there;
    # every marketplace task stays on the default `celery` queue, which this
    # worker never subscribes to. Proven in tests/test_celery_routing.py and
    # against a real broker.
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q hotelos --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/stayos
      - PLACES_CACHE_DIR=/tmp/stayos/places_cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── no `beat` service, deliberately ─────────────────────────────────────────
  #
  # Every entry in `beat_schedule` is a marketplace task, and
  # `travbuddy.partners.revert_intro_commission` fires hourly and *writes* to
  # `partners` — a table that also exists, meaning something entirely
  # different, in the hotel OS. Beat belongs to the marketplace stack alone.

volumes:
  stayos_redis_data:
