version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`backend.travbuddy.in`)"
      - "traefik.http.routers.api.entrypoints=https"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/travbuddy
      - PLACES_CACHE_DIR=/tmp/travbuddy/places_cache
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp_key.json
      - GCP_PROJECT=${GCP_PROJECT}
      - GCP_LOCATION=${GCP_LOCATION:-us-central1}
    volumes:
      - /tmp/travbuddy:/tmp/travbuddy
      - /home/sahilverma/travbuddy_backend.json:/secrets/gcp_key.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    # Pipeline work is I/O-bound (download, GCS, Gemini, Places) — concurrency 4
    # lets multiple reels process in parallel. Override with CELERY_CONCURRENCY.
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/travbuddy
      - PLACES_CACHE_DIR=/tmp/travbuddy/places_cache
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp_key.json
      - GCP_PROJECT=${GCP_PROJECT}
      - GCP_LOCATION=${GCP_LOCATION:-us-central1}
    volumes:
      - /tmp/travbuddy:/tmp/travbuddy
      - /home/sahilverma/travbuddy_backend.json:/secrets/gcp_key.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    # Scheduler for the recommendation-engine nightly/weekly jobs (schedule lives in
    # app.workers.celery_app.beat_schedule). ONE beat instance only — never scale >1
    # or jobs double-fire. The worker service above executes what beat enqueues.
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info --schedule=/tmp/travbuddy/celerybeat-schedule
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/travbuddy
      - PLACES_CACHE_DIR=/tmp/travbuddy/places_cache
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp_key.json
      - GCP_PROJECT=${GCP_PROJECT}
      - GCP_LOCATION=${GCP_LOCATION:-us-central1}
    volumes:
      - /tmp/travbuddy:/tmp/travbuddy
      - /home/sahilverma/travbuddy_backend.json:/secrets/gcp_key.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data: