version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`backend.travbuddy.in`)"
      - "traefik.http.routers.api.entrypoints=https"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/travbuddy
      - PLACES_CACHE_DIR=/tmp/travbuddy/places_cache
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp_key.json
      - GCP_PROJECT=${GCP_PROJECT}
      - GCP_LOCATION=${GCP_LOCATION:-us-central1}
    volumes:
      - /tmp/travbuddy:/tmp/travbuddy
      - /home/sahilverma/travbuddy_backend.json:/secrets/gcp_key.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/travbuddy
      - PLACES_CACHE_DIR=/tmp/travbuddy/places_cache
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp_key.json
      - GCP_PROJECT=${GCP_PROJECT}
      - GCP_LOCATION=${GCP_LOCATION:-us-central1}
    volumes:
      - /tmp/travbuddy:/tmp/travbuddy
      - /home/sahilverma/travbuddy_backend.json:/secrets/gcp_key.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data: