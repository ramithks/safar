version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/travbuddy
      - PLACES_CACHE_DIR=/tmp/travbuddy/places_cache
    volumes:
      - /tmp/travbuddy:/tmp/travbuddy
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEMP_DIR=/tmp/travbuddy
      - PLACES_CACHE_DIR=/tmp/travbuddy/places_cache
    volumes:
      - /tmp/travbuddy:/tmp/travbuddy
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data: